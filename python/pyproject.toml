[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-googleplay"
version = "0.1.1"
description = "Typed Google Play client for the Crawlora hosted API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=googleplay-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=googleplay-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-googleplay"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_googleplay"]

[tool.setuptools.package-data]
"crawlora_googleplay" = ["py.typed", "*.pyi"]
